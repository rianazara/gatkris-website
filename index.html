    <meta
      name="description"
      content="Gayatri Gopalakrishnan — Technical PM, builder, and pattern-seeker across AI, markets, music, and movement."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gayatri Gopalakrishnan",
        "jobTitle": "Sr Technical Program Manager",
        "url": "https://gatkris.com",
        "image": "https://gatkris.com/img/avatar.jpg",
        "sameAs": []
      }
    </script>
    <!-- Set theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var stored = q || localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  </body>
