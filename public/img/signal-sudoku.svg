<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 3x3 Sudoku mini grid -->
  <g transform="translate(125, 50)">
    <rect x="0" y="0" width="150" height="150" fill="none" stroke="#c9a84c" stroke-width="3" rx="4"/>
    <line x1="50" y1="0" x2="50" y2="150" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="0" x2="100" y2="150" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="50" x2="150" y2="50" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="100" x2="150" y2="100" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
    <text x="25" y="35" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="24" opacity="0.9">8</text>
    <text x="75" y="35" text-anchor="middle" fill="#f5f0eb" font-family="Georgia, serif" font-size="24" opacity="0.6">3</text>
    <text x="125" y="35" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="24" opacity="0.9">1</text>
    <text x="25" y="85" text-anchor="middle" fill="#f5f0eb" font-family="Georgia, serif" font-size="24" opacity="0.6">4</text>
    <text x="75" y="85" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="24" opacity="0.9">9</text>
    <text x="125" y="85" text-anchor="middle" fill="#f5f0eb" font-family="Georgia, serif" font-size="24" opacity="0.6">7</text>
    <text x="25" y="135" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="24" opacity="0.9">5</text>
    <text x="75" y="135" text-anchor="middle" fill="#f5f0eb" font-family="Georgia, serif" font-size="24" opacity="0.6">2</text>
    <text x="125" y="135" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="24" opacity="0.9">6</text>
  </g>
  <text x="200" y="240" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="16" letter-spacing="3">NATIONAL BEST 2</text>
  <text x="200" y="265" text-anchor="middle" fill="#f5f0eb" font-family="Georgia, serif" font-size="13" opacity="0.6" letter-spacing="2">GLOBAL BEST 3</text>
</svg>
